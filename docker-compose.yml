services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ketrika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ketrika}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ketrika} -d ${POSTGRES_DB:-ketrika}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_BRONZE:-bronze};
      /usr/bin/mc version enable local/${S3_BUCKET_BRONZE:-bronze};
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ketrika-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8090}:8000"
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ketrika:change-me@db:5432/ketrika}
      - POSTGRES_USER=${POSTGRES_USER:-ketrika}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-ketrika}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_BRONZE=${S3_BUCKET_BRONZE:-bronze}
      - S3_REGION=${S3_REGION:-auto}
      - PYTHONPATH=/app/src
      - KETRIKA_REPO_ROOT=/workspace
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./:/workspace:ro
    command: ["uvicorn", "ketrika.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  dagster-webserver:
    image: ketrika-backend:dev
    restart: unless-stopped
    ports:
      - "${DAGSTER_PORT:-3010}:3001"
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ketrika:change-me@db:5432/ketrika}
      - POSTGRES_USER=${POSTGRES_USER:-ketrika}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-ketrika}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_BRONZE=${S3_BUCKET_BRONZE:-bronze}
      - S3_REGION=${S3_REGION:-auto}
      - PYTHONPATH=/app/src
      - KETRIKA_REPO_ROOT=/workspace
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./docker/dagster:/opt/dagster/dagster_home:ro
      - ./:/workspace:ro
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3001", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/server_info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  dagster-daemon:
    image: ketrika-backend:dev
    restart: unless-stopped
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://ketrika:change-me@db:5432/ketrika}
      - POSTGRES_USER=${POSTGRES_USER:-ketrika}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-ketrika}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_BUCKET_BRONZE=${S3_BUCKET_BRONZE:-bronze}
      - S3_REGION=${S3_REGION:-auto}
      - PYTHONPATH=/app/src
      - KETRIKA_REPO_ROOT=/workspace
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./docker/dagster:/opt/dagster/dagster_home:ro
      - ./:/workspace:ro
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ketrika-web:dev
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3005}:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://api:8000}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: ["pnpm", "dev"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
  backend_venv:
  web_node_modules:
  web_next:
  dagster_home:
