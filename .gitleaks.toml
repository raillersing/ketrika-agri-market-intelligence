# .gitleaks.toml
# Gitleaks configuration and false-positive allowlist for Ketrika

[extend]
useDefault = true

[allowlist]
description = "Allowlist for deterministic cache hashes, partition identifiers, and replay fixtures"
paths = [
    '''backend/tests/fixtures/llm/.*''',
]
regexes = [
    # Exact non-secret Dagster step ID in R0.6 first-red report, line 140.
    # Generated by dummy_dagster_<uuid>, not a credential; no wildcard exemption.
    '''dummy_dagster_f1196e09722e43719f44a7cb10249ff2__bronze''',
    '''odr_bulletin_\d+''',
    '''"cache_key": "[a-f0-9]{64}"''',
]
