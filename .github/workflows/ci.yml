name: CI

on:
  push:
    branches: [main]
    # AGENTS §3.3: bounded documentary exception; contracts still trigger CI.
    paths-ignore:
      - docs/plan/PROGRESS.md
      - docs/HANDOFF.md
      - docs/MARKET_INTELLIGENCE_REPORT.md
      - docs/evidence/R0.8_CHECK_*
      - docs/evidence/R0.8_E2E_*
      - docs/evidence/R0.8_CI_*
      - docs/evidence/R0.8_WB_ACTIVE_CLICK_*
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/plan/PROGRESS.md
      - docs/HANDOFF.md
      - docs/MARKET_INTELLIGENCE_REPORT.md
      - docs/evidence/R0.8_CHECK_*
      - docs/evidence/R0.8_E2E_*
      - docs/evidence/R0.8_CI_*
      - docs/evidence/R0.8_WB_ACTIVE_CLICK_*

permissions:
  contents: read

jobs:
  quality-checks:
    name: Isolated backend, integration and frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all locked qualification images through the local entrypoint
        run: bash scripts/dev.sh qa-build

      - name: Release build-only cache on the ephemeral CI runner
        run: |
          df -h / /var/lib/docker
          docker builder prune --all --force
          df -h / /var/lib/docker

      - name: Run the same isolated check as local development
        run: bash scripts/dev.sh check

      - name: Execute task manifest and actual browser authentication
        run: |
          bash scripts/dev.sh qa R0.3
          bash scripts/dev.sh qa-isolated negative-build
          bash scripts/dev.sh e2e

      - name: Show qualification service state on failure
        if: failure()
        run: >-
          docker compose --env-file scripts/qualification.env
          --project-name ketrika-qualification-main-final
          -f docker-compose.qualification.yml ps -a

      - name: Preserve native qualification reports without session traces
        if: always()
        run: |
          for role in backend frontend browser; do
            case "$role" in
              backend) volume=ketrika_qualification_main_final_backend_venv_r05 ;;
              frontend) volume=ketrika_qualification_main_final_web_node_modules_r05 ;;
              browser) volume=ketrika_qualification_main_final_browser_venv_r05 ;;
            esac
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              mkdir -p "$PWD/qa-evidence"
              docker run --rm --user 0 --network none \
                --mount "type=bind,source=$PWD,target=/workspace,readonly" \
                --mount "type=bind,source=$PWD/qa-evidence,target=/out" \
                --mount "type=volume,source=$volume,target=/reports,readonly" \
                -e PYTHONPATH=/workspace/backend/src \
                ketrika-backend:qa-codex-r05 \
                python -m ketrika.core.qualification_reports export-reports "$role" /reports "/out/$role"
            fi
          done

      - name: Archive native reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
