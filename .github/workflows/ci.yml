name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-checks:
    name: Isolated backend, integration and frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend tooling image
        run: |
          docker build --target base -t ketrika-backend:test backend

      - name: Build web image
        run: |
          docker build -t ketrika-web:dev web

      - name: Run the same isolated check as local development
        run: bash scripts/dev.sh check

      - name: Show qualification service state on failure
        if: failure()
        run: >-
          docker compose --env-file scripts/qualification.env
          --project-name ketrika-qualification
          -f docker-compose.qualification.yml ps -a
