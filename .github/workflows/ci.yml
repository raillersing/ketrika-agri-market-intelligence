name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  LLM_PROVIDER: replay
  APP_ENV: test

jobs:
  quality-checks:
    name: Lint, Typecheck and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend test image
        run: |
          docker build --target test -t ketrika-backend:test backend

      - name: Build web image
        run: |
          docker build -t ketrika-web:dev web

      - name: Run backend checks (ruff, mypy, pytest)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend:/app" \
            -v "${{ github.workspace }}:/workspace" \
            -w /app \
            ketrika-backend:test \
            sh -c "ruff check src tests && ruff format --check src tests && mypy src tests && pytest -m 'not network'"

      - name: Run web checks (vitest)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/web:/app" \
            -v /app/node_modules \
            -w /app \
            ketrika-web:dev \
            pnpm test

  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ketrika
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: ketrika
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend test image
        run: |
          docker build --target test -t ketrika-backend:test backend

      - name: Initialize MinIO bronze bucket
        run: |
          docker run --rm --network host minio/minio:latest /bin/sh -c "
            /usr/bin/mc alias set local http://localhost:9000 minioadmin minioadmin &&
            /usr/bin/mc mb --ignore-existing local/bronze &&
            /usr/bin/mc version enable local/bronze
          "

      - name: Run integration tests
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgresql+psycopg://ketrika:change-me@localhost:5432/ketrika" \
            -e S3_ENDPOINT_URL="http://localhost:9000" \
            -e S3_ACCESS_KEY="minioadmin" \
            -e S3_SECRET_KEY="minioadmin" \
            -e S3_BUCKET_BRONZE="bronze" \
            -e LLM_PROVIDER="replay" \
            ketrika-backend:test \
            pytest -m "integration"
