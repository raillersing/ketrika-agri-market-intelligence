name: CI

on:
  push:
    branches: [main]
    # AGENTS §3.3: bounded documentary exception; contracts still trigger CI.
    paths-ignore:
      - docs/plan/PROGRESS.md
      - docs/HANDOFF.md
      - docs/MARKET_INTELLIGENCE_REPORT.md
      - docs/evidence/R0.8_CHECK_*
      - docs/evidence/R0.8_E2E_*
      - docs/evidence/R0.8_CI_*
      - docs/evidence/R0.8_WB_ACTIVE_CLICK_*
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/plan/PROGRESS.md
      - docs/HANDOFF.md
      - docs/MARKET_INTELLIGENCE_REPORT.md
      - docs/evidence/R0.8_CHECK_*
      - docs/evidence/R0.8_E2E_*
      - docs/evidence/R0.8_CI_*
      - docs/evidence/R0.8_WB_ACTIVE_CLICK_*

permissions:
  contents: read

jobs:
  quality-checks:
    name: Isolated backend, integration and frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all locked qualification images through the local entrypoint
        run: bash scripts/dev.sh qa-build

      - name: Run the same isolated check as local development
        run: bash scripts/dev.sh check

      - name: Execute task manifest and actual browser authentication
        run: |
          bash scripts/dev.sh qa R0.3
          bash scripts/dev.sh qa-isolated negative-build
          bash scripts/dev.sh e2e

      - name: Show qualification service state on failure
        if: failure()
        run: >-
          docker compose --env-file scripts/qualification.env
          --project-name ketrika-qualification-main-final
          -f docker-compose.qualification.yml ps -a
