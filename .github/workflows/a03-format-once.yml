name: A03 one-time formatter (maintenance branch only)

on:
  push:
    branches:
      - fix/a03-format-ruff-20261116

permissions:
  contents: write

jobs:
  format:
    # Never operate on main, release branches, forks, or arbitrary refs.
    if: github.repository == 'raillersing/ketrika-agri-market-intelligence' && github.ref == 'refs/heads/fix/a03-format-ruff-20261116'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the exact maintenance branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python for the pinned Ruff formatter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff 0.16.10 (matching backend/uv.lock)
        run: python -m pip install --disable-pip-version-check 'ruff==0.16.10'

      - name: Format backend and tests deterministically
        run: |
          ruff --version
          cd backend
          ruff format src tests
          ruff format --check src tests
          ruff check src tests

      - name: Inspect safe formatting-only changes
        run: |
          git diff --check
          git diff --stat
          git status --short

      - name: Commit the formatter's actual output on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/src backend/tests
          if ! git diff --cached --quiet; then
            git commit -m "style(A03): appliquer Ruff 0.16.10 sur src et tests"
            git push origin HEAD:refs/heads/fix/a03-format-ruff-20261116
          else
            echo "No formatting needed"
          fi
