[project]
name = "ketrika"
version = "0.1.0"
description = "Ketrika Agri Market Intelligence backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.0",
    "anthropic>=0.34.0",
    "argon2-cffi>=23.1.0",
    "boto3>=1.34.0",
    "dagster>=1.8.0",
    "dagster-postgres>=0.24.0",
    "dagster-webserver>=1.8.0",
    "fastapi>=0.115.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "lxml>=5.2.0",
    "openai>=1.40.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pandera>=0.20.0",
    "pdfplumber>=0.11.0",
    "polars>=1.6.0",
    "protego>=0.3.1",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdfium2>=4.30.0",
    "pyproj>=3.6.0",
    "pyjwt>=2.9.0",
    "rapidfuzz>=3.9.0",
    "selectolax>=0.3.21",
    "shapely>=2.0.0",
    "sqlalchemy>=2.0.30",
    "sqlglot>=25.0.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.30.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.110.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpserver>=1.0.10",
    "ruff>=0.6.0",
    "types-boto3>=1.34.0",
    "types-openpyxl>=3.1.5",
    "types-pyyaml>=6.0.12",
]
geo = [
    "geopandas>=1.0.0",
    "rasterio>=1.3.10",
]
ml = [
    "lightgbm>=4.5.0",
    "mlforecast>=0.13.0",
    "statsforecast>=1.7.0",
    "utilsforecast>=0.2.0",
]
browser = [
    "playwright>=1.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ketrika"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "ketrika.core.*",
    "ketrika.extraction.*",
    "ketrika.normalize.*",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pdfplumber.*",
    "selectolax.*",
    "weasyprint.*",
    "dagster.*",
    "statsforecast.*",
    "mlforecast.*",
    "lightgbm.*",
    "geopandas.*",
    "shapely.*",
    "pandera.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests accessing live internet sources",
    "integration: database or service integration tests",
    "golden: golden dataset validation tests",
    "slow: tests taking > 5s to run",
]
