name: ketrika-wb-replay-20261104
services:
  db:
    image: postgis/postgis:17-3.5
    network_mode: none
    environment:
      POSTGRES_USER: ketrika
      POSTGRES_PASSWORD: qa-local-only
      POSTGRES_DB: ketrika_rebuild_qualification
    command: [postgres, -c, "listen_addresses="]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - socket:/var/run/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h /var/run/postgresql -U ketrika -d ketrika_rebuild_qualification"]
      interval: 2s
      timeout: 5s
      retries: 30
  worker: &worker
    image: ketrika-backend:qa-codex-r05
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1000:1000"
    working_dir: /workspace/backend
    environment:
      DATABASE_URL: postgresql+psycopg://ketrika:qa-local-only@/ketrika_rebuild_qualification?host=/run/ketrika-rebuild
      APP_ENV: test
      LLM_PROVIDER: replay
      EXTERNAL_SEND_ENABLED: "0"
      PYTHONPATH: /workspace/backend/src
      KETRIKA_REPO_ROOT: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - code:/workspace:ro
      - packet:/packet:ro
      - socket:/run/ketrika-rebuild
      - bronze:/copy:ro
      - output:/out
    tmpfs: [/tmp]
    depends_on:
      db: {condition: service_healthy}
    command: [python, /workspace/backend/scripts/wb_archive_qualification.py, replay]
  prepare:
    <<: *worker
    user: "0:0"
    volumes:
      - code:/workspace:ro
      - packet:/packet:ro
      - socket:/run/ketrika-rebuild
      - bronze:/copy
      - output:/out
    command: [python, /workspace/backend/scripts/wb_archive_qualification.py, prepare]
volumes:
  pgdata:
    name: ketrika_wb_replay_pgdata_20261104
  socket:
    name: ketrika_wb_replay_socket_20261104
  bronze:
    name: ketrika_wb_replay_bronze_20261104
  output:
    name: ketrika_wb_replay_output_20261104
  packet:
    name: ketrika_wb_revision_packet_20261104
    external: true
  code:
    name: ketrika_wb_replay_code_20261104
    external: true
